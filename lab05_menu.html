<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1</title>
    <style>
        ul,li {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        a {
            text-decoration: none;
            color: #000;
        }
        .menu-1 {
            background-color: #81f0d3;
            display: inline-block;
            margin-bottom: 20px;
        }
        .menu-1 ul {
            display: flex;
        }
        .menu-1 ul li a {
            display: block;
            padding: 10px 15px;
            border-radius: 5px;
            transition: .3s;
        }
        .menu-1 ul li a:hover, .menu-1 ul li.active a {
            color: #fff;
            background-color: #f39c12;
            font-weight: bold;
        }       
        .menu-2 {
            background-color: #3498db;
            width: 200px;
        }
        .menu-2 li {
            border-bottom: 1px solid #fff;
        }
        .menu-2 li a {
            padding: 10px 15px;
            background-color: #3498db;
            color: #000;
            display: block;
            transition: .3s;
        }
        .menu-2 li a:hover, .menu-2 li.active a {
            filter: brightness(130%); 
            font-style: italic;
        }
    </style>
</head>
<body>
    <nav class="menu-1">
        <ul>
            <li class="active"><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Sản phẩm</a></li>
            <li><a href="#">Dịch vụ</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </nav>
    <nav class="menu-2">
        <ul>
            <li class="active"><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Sản phẩm</a></li>
            <li><a href="#">Dịch vụ</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </nav>
</body>
</html>
